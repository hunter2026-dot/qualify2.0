<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunter CRM - Kanban</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f1a17;
    --forest: #103b30;
    --forest-deep: #0a2820;
    --moss: #1f6e56;
    --amber: #e2a53a;
    --amber-soft: #f4d9a8;
    --bg: #eef1ee;
    --paper: #ffffff;
    --line: #dde3de;
    --muted: #6b756f;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(16,59,48,0.07) 1px, transparent 0);
    background-size: 22px 22px;
    margin: 0;
    color: var(--ink);
  }

  header {
    background: var(--forest-deep);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 3px solid var(--amber);
  }
  #new-lead-btn {
    background: var(--amber);
    color: var(--forest-deep);
    border: none;
    border-radius: 7px;
    padding: 8px 14px;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
  }
  #new-lead-btn:hover { background: #eeb75a; }
  header .mark {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 19px;
    color: #fff;
    letter-spacing: -0.02em;
  }
  header .mark span { color: var(--amber); }
  .tabs { display: flex; gap: 4px; margin-left: 8px; }
  .tab {
    font-family: 'Sora', sans-serif; font-weight: 600; font-size: 12.5px;
    color: #9fb8ac; text-decoration: none; padding: 6px 12px; border-radius: 6px;
  }
  .tab:hover { color: white; background: rgba(255,255,255,0.06); }
  .tab.active { color: white; background: var(--forest); }
  header .sub {
    font-size: 12px;
    color: #9fb8ac;
    font-family: 'JetBrains Mono', monospace;
  }

  main { padding: 22px 28px 40px; }

  #status {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 14px;
    font-family: 'JetBrains Mono', monospace;
  }

  #board {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    align-items: flex-start;
    padding-bottom: 24px;
  }

  .column {
    background: var(--paper);
    border-radius: 10px;
    width: 268px;
    flex-shrink: 0;
    max-height: calc(100vh - 140px);
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    box-shadow: 0 1px 3px rgba(15,26,23,0.06);
  }
  .column-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 14px;
    border-top: 4px solid var(--moss);
    border-radius: 10px 10px 0 0;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--forest-deep);
  }
  .column-count {
    font-weight: 500;
    color: var(--muted);
    font-size: 11px;
    margin-left: 6px;
    font-family: 'JetBrains Mono', monospace;
    text-transform: none;
  }
  .col-menu-btn {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 16px;
    color: var(--muted);
    padding: 2px 7px;
    border-radius: 5px;
    line-height: 1;
  }
  .col-menu-btn:hover { background: var(--bg); color: var(--forest-deep); }

  .cards {
    padding: 10px;
    overflow-y: auto;
    flex: 1;
    min-height: 50px;
    transition: background 0.12s ease;
  }
  .cards.drag-over { background: var(--amber-soft); border-radius: 0 0 10px 10px; }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 3px solid var(--moss);
    border-radius: 7px;
    padding: 11px 12px;
    margin-bottom: 9px;
    cursor: grab;
    transition: box-shadow 0.12s ease, transform 0.12s ease;
  }
  .card:hover { box-shadow: 0 3px 10px rgba(15,26,23,0.12); transform: translateY(-1px); }
  .card:active { cursor: grabbing; }
  .card-name { font-weight: 600; font-size: 13.5px; color: var(--ink); }
  .card-phone {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
    font-family: 'JetBrains Mono', monospace;
  }
  .card-source {
    display: inline-block;
    font-size: 10.5px;
    color: var(--forest);
    background: #e4ede9;
    border-radius: 4px;
    padding: 2px 6px;
    margin-top: 6px;
    font-weight: 500;
  }

  .add-column {
    width: 248px;
    flex-shrink: 0;
    height: 46px;
    border: 2px dashed #c3ccc6;
    background: transparent;
    border-radius: 10px;
    color: var(--forest);
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .add-column:hover { background: var(--paper); border-color: var(--moss); }

  /* ===== Painel de chat ===== */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 20, 17, 0.45);
    z-index: 10;
  }
  #overlay.open { display: block; }

  #chat-panel {
    position: fixed;
    top: 0; right: 0;
    width: 400px;
    max-width: 92vw;
    height: 100vh;
    background: var(--paper);
    box-shadow: -6px 0 24px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.18s ease;
    z-index: 11;
  }
  #chat-panel.open { transform: translateX(0); }

  #chat-header {
    background: var(--forest-deep);
    color: white;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 3px solid var(--amber);
  }
  #chat-header .name { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px; }
  #chat-header .phone { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9fb8ac; margin-top: 3px; }
  #chat-close {
    background: transparent; border: none; color: #cfe0d8;
    font-size: 20px; cursor: pointer; line-height: 1; padding: 2px 6px;
  }
  #chat-close:hover { color: white; }

  #chat-subtabs {
    display: flex;
    gap: 2px;
    padding: 8px 12px 0;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .subtab {
    background: transparent;
    border: none;
    padding: 8px 12px;
    font-family: 'Sora', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .subtab.active { color: var(--forest-deep); border-bottom-color: var(--moss); }

  #fields-view {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    background: var(--bg);
  }
  #fields-view.open { display: block; }
  #chat-messages.hidden, #chat-input-row.hidden { display: none; }

  .field-row {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
    background: white;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 9px;
  }
  .field-row .fkey { font-size: 11px; color: var(--muted); font-weight: 600; min-width: 90px; }
  .field-row .fval { flex: 1; font-size: 13px; border: none; background: transparent; }
  .field-row .fval:focus { outline: none; }
  .field-del { background: transparent; border: none; color: #a13939; cursor: pointer; font-size: 15px; }

  #add-field-row { display: flex; gap: 6px; margin-top: 10px; }
  #add-field-row input {
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 12.5px;
  }
  #field-key-input { width: 40%; }
  #field-val-input { flex: 1; }
  #add-field-btn {
    background: var(--forest); color: white; border: none; border-radius: 6px;
    padding: 0 12px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 12px; cursor: pointer;
  }
  #delete-lead-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.25); color: #f3b8b8;
    border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; margin-top: 8px;
  }
  #delete-lead-btn:hover { background: rgba(161,57,57,0.25); }

  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--bg);
  }
  .msg {
    max-width: 78%;
    padding: 8px 11px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.4;
  }
  .msg .time {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
    font-family: 'JetBrains Mono', monospace;
  }
  .msg.in {
    align-self: flex-start;
    background: white;
    border: 1px solid var(--line);
    border-bottom-left-radius: 3px;
  }
  .msg.out {
    align-self: flex-end;
    background: var(--amber-soft);
    border-bottom-right-radius: 3px;
  }
  .msg.out .time { text-align: right; }
  #chat-empty { color: var(--muted); font-size: 13px; text-align: center; margin-top: 30px; }

  #chat-input-row {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--line);
  }
  #chat-input {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    resize: none;
  }
  #chat-input:focus { outline: none; border-color: var(--moss); }
  #chat-send {
    background: var(--forest);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 16px;
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  #chat-send:hover { background: var(--forest-deep); }
  #chat-send:disabled { background: #b7c0ba; cursor: default; }
</style>
</head>
<body>

<header>
  <span class="mark">hunter<span>.</span>crm</span>
  <nav class="tabs">
    <a href="/" class="tab active">Pipeline</a>
    <a href="/disparo.html" class="tab">Disparos</a>
  </nav>
  <button id="new-lead-btn" style="margin-left:auto;">+ novo lead</button>
</header>
<main>
  <div id="status">carregando...</div>
  <div id="board"></div>
</main>

<div id="overlay"></div>
<div id="chat-panel">
  <div id="chat-header">
    <div>
      <div class="name" id="chat-lead-name">—</div>
      <div class="phone" id="chat-lead-phone">—</div>
      <button id="delete-lead-btn">Excluir lead</button>
    </div>
    <button id="chat-close">✕</button>
  </div>
  <div id="chat-subtabs">
    <button class="subtab active" id="subtab-chat">Conversa</button>
    <button class="subtab" id="subtab-fields">⋯ Campos</button>
  </div>
  <div id="chat-messages"></div>
  <div id="fields-view">
    <div id="fields-list"></div>
    <div id="add-field-row">
      <input type="text" id="field-key-input" placeholder="Nome do campo (ex: faturamento)">
      <input type="text" id="field-val-input" placeholder="Valor">
      <button id="add-field-btn">+</button>
    </div>
  </div>
  <div id="chat-input-row">
    <textarea id="chat-input" rows="1" placeholder="Escreva uma mensagem..."></textarea>
    <button id="chat-send">Enviar</button>
  </div>
</div>

<script>
// ============================================
// Lógica pura (testada separadamente antes de entrar aqui)
// ============================================
function groupLeadsByStage(leads, stages) {
  const map = {};
  stages.forEach(s => { map[s.id] = []; });
  leads.forEach(lead => {
    if (map[lead.stage_id]) map[lead.stage_id].push(lead);
    else if (!map['__sem_coluna__']) map['__sem_coluna__'] = [lead];
    else map['__sem_coluna__'].push(lead);
  });
  return map;
}

function nextPosition(stages) {
  if (stages.length === 0) return 1;
  return Math.max(...stages.map(s => s.position)) + 1;
}

function sortLeadsByActivity(leadsArr) {
  return [...leadsArr].sort((a, b) => {
    const ta = a.last_message_at ? new Date(a.last_message_at).getTime() : null;
    const tb = b.last_message_at ? new Date(b.last_message_at).getTime() : null;
    if (ta !== null && tb !== null) return tb - ta;
    if (ta !== null && tb === null) return -1;
    if (ta === null && tb !== null) return 1;
    return new Date(b.created_at).getTime() - new Date(a.created_at).getTime();
  });
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ============================================
// Estado e carregamento de dados
// ============================================
let sb;
let stages = [];
let leads = [];

async function init() {
  const statusEl = document.getElementById('status');
  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    if (!cfg.supabaseUrl || !cfg.supabasePublishableKey) {
      statusEl.textContent = 'Faltam as variáveis SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY na Vercel.';
      return;
    }
    sb = supabase.createClient(cfg.supabaseUrl, cfg.supabasePublishableKey);
    await loadBoard();
    statusEl.textContent = '';
    setupRealtime();
  } catch (err) {
    statusEl.textContent = 'Erro ao carregar: ' + err.message;
    console.error(err);
  }
}

function setupRealtime() {
  // Assim que chega mensagem nova ou um lead muda, atualiza o quadro sozinho
  sb.channel('board-updates')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => {
      loadBoard();
      if (currentLead) loadMessages();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'leads' }, () => {
      loadBoard();
    })
    .subscribe();
}

async function loadBoard() {
  const { data: stagesData, error: stagesErr } = await sb.from('stages').select('*').order('position');
  if (stagesErr) throw stagesErr;
  const { data: leadsData, error: leadsErr } = await sb.from('leads').select('*');
  if (leadsErr) throw leadsErr;
  stages = stagesData || [];
  leads = leadsData || [];
  render();
}

// ============================================
// Renderização
// ============================================
function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const grouped = groupLeadsByStage(leads, stages);

  stages.forEach(stage => {
    const col = document.createElement('div');
    col.className = 'column';

    const header = document.createElement('div');
    header.className = 'column-header';
    header.style.borderTopColor = stage.color || '#94a3b8';
    header.innerHTML =
      '<span>' + escapeHtml(stage.name) +
      '<span class="column-count">(' + (grouped[stage.id] || []).length + ')</span></span>';

    const menuBtn = document.createElement('button');
    menuBtn.className = 'col-menu-btn';
    menuBtn.textContent = '⋯';
    menuBtn.onclick = () => openColumnMenu(stage);
    header.appendChild(menuBtn);

    const cardsContainer = document.createElement('div');
    cardsContainer.className = 'cards';
    cardsContainer.dataset.stageId = stage.id;
    cardsContainer.addEventListener('dragover', onDragOver);
    cardsContainer.addEventListener('dragleave', onDragLeave);
    cardsContainer.addEventListener('drop', onDrop);

    (grouped[stage.id] ? sortLeadsByActivity(grouped[stage.id]) : []).forEach(lead => {
      cardsContainer.appendChild(renderCard(lead));
    });

    col.appendChild(header);
    col.appendChild(cardsContainer);
    board.appendChild(col);
  });

  const addColBtn = document.createElement('button');
  addColBtn.className = 'add-column';
  addColBtn.textContent = '+ nova coluna';
  addColBtn.onclick = createNewStage;
  board.appendChild(addColBtn);
}

function renderCard(lead) {
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.dataset.leadId = lead.id;
  card.innerHTML =
    '<div class="card-name">' + escapeHtml(lead.name || lead.phone) + '</div>' +
    '<div class="card-phone">' + escapeHtml(lead.phone) + '</div>' +
    (lead.source ? '<div class="card-source">' + escapeHtml(lead.source) + '</div>' : '');
  card.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', lead.id);
  });
  card.addEventListener('click', () => openChat(lead));
  return card;
}

// ============================================
// Painel de chat
// ============================================
let currentLead = null;

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

async function openChat(lead) {
  currentLead = lead;
  document.getElementById('chat-lead-name').textContent = lead.name || lead.phone;
  document.getElementById('chat-lead-phone').textContent = lead.phone;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('chat-panel').classList.add('open');
  document.getElementById('chat-input').value = '';
  showChatSubtab();
  await loadMessages();
}

function closeChat() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('chat-panel').classList.remove('open');
  currentLead = null;
}

function showChatSubtab() {
  document.getElementById('subtab-chat').classList.add('active');
  document.getElementById('subtab-fields').classList.remove('active');
  document.getElementById('chat-messages').classList.remove('hidden');
  document.getElementById('chat-input-row').classList.remove('hidden');
  document.getElementById('fields-view').classList.remove('open');
}

function showFieldsSubtab() {
  document.getElementById('subtab-fields').classList.add('active');
  document.getElementById('subtab-chat').classList.remove('active');
  document.getElementById('chat-messages').classList.add('hidden');
  document.getElementById('chat-input-row').classList.add('hidden');
  document.getElementById('fields-view').classList.add('open');
  renderFields();
}

document.getElementById('subtab-chat').addEventListener('click', showChatSubtab);
document.getElementById('subtab-fields').addEventListener('click', showFieldsSubtab);

// ============================================
// Campos personalizados (faturamento, histórico, etc)
// ============================================
function renderFields() {
  const list = document.getElementById('fields-list');
  const fields = (currentLead && currentLead.custom_fields) || {};
  const keys = Object.keys(fields);

  if (keys.length === 0) {
    list.innerHTML = '<div style="font-size:12.5px;color:var(--muted);">Nenhum campo ainda. Adicione abaixo.</div>';
    return;
  }

  list.innerHTML = '';
  keys.forEach(key => {
    const row = document.createElement('div');
    row.className = 'field-row';
    row.innerHTML =
      '<span class="fkey">' + escapeHtml(key) + '</span>' +
      '<input class="fval" type="text" value="' + escapeHtml(fields[key]) + '" data-key="' + escapeHtml(key) + '">' +
      '<button class="field-del" data-key="' + escapeHtml(key) + '">✕</button>';
    list.appendChild(row);
  });

  list.querySelectorAll('.fval').forEach(input => {
    input.addEventListener('change', async (e) => {
      await updateField(e.target.dataset.key, e.target.value);
    });
  });
  list.querySelectorAll('.field-del').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      await deleteField(e.target.dataset.key);
    });
  });
}

async function updateField(key, value) {
  const fields = { ...(currentLead.custom_fields || {}), [key]: value };
  const { error } = await sb.from('leads').update({ custom_fields: fields }).eq('id', currentLead.id);
  if (error) { alert('Erro ao salvar campo: ' + error.message); return; }
  currentLead.custom_fields = fields;
  const leadInMemory = leads.find(l => l.id === currentLead.id);
  if (leadInMemory) leadInMemory.custom_fields = fields;
}

async function deleteField(key) {
  const fields = { ...(currentLead.custom_fields || {}) };
  delete fields[key];
  const { error } = await sb.from('leads').update({ custom_fields: fields }).eq('id', currentLead.id);
  if (error) { alert('Erro ao remover campo: ' + error.message); return; }
  currentLead.custom_fields = fields;
  const leadInMemory = leads.find(l => l.id === currentLead.id);
  if (leadInMemory) leadInMemory.custom_fields = fields;
  renderFields();
}

document.getElementById('add-field-btn').addEventListener('click', async () => {
  const keyInput = document.getElementById('field-key-input');
  const valInput = document.getElementById('field-val-input');
  const key = keyInput.value.trim();
  const val = valInput.value.trim();
  if (!key) { alert('Dá um nome pro campo (ex: faturamento).'); return; }
  await updateField(key, val);
  keyInput.value = '';
  valInput.value = '';
  renderFields();
});

// ============================================
// Excluir lead
// ============================================
document.getElementById('delete-lead-btn').addEventListener('click', async () => {
  if (!currentLead) return;
  if (!confirm('Excluir "' + (currentLead.name || currentLead.phone) + '"? Isso apaga o lead e todo o histórico de conversa dele. Não dá pra desfazer.')) return;

  const { error } = await sb.from('leads').delete().eq('id', currentLead.id);
  if (error) { alert('Erro ao excluir: ' + error.message); return; }

  closeChat();
  await loadBoard();
});

// ============================================
// Criar lead manualmente
// ============================================
document.getElementById('new-lead-btn').addEventListener('click', async () => {
  const name = prompt('Nome do lead:');
  if (name === null) return;
  const phoneRaw = prompt('Telefone (com DDD, só números. Ex: 5551999998888):');
  if (phoneRaw === null) return;
  const phone = phoneRaw.replace(/\D/g, '');
  if (!phone) { alert('Telefone inválido.'); return; }
  const source = prompt('Origem (opcional, ex: indicação, instagram):') || null;

  const { error } = await sb.from('leads').insert({ name: name || null, phone, source });
  if (error) {
    if (error.code === '23505') alert('Já existe um lead com esse telefone.');
    else alert('Erro ao criar lead: ' + error.message);
    return;
  }
  await loadBoard();
});

async function loadMessages() {
  const container = document.getElementById('chat-messages');
  container.innerHTML = '<div id="chat-empty">Carregando conversa...</div>';

  const { data, error } = await sb
    .from('messages')
    .select('*')
    .eq('lead_id', currentLead.id)
    .order('created_at', { ascending: true });

  if (error) {
    container.innerHTML = '<div id="chat-empty">Erro ao carregar: ' + escapeHtml(error.message) + '</div>';
    return;
  }

  if (!data || data.length === 0) {
    container.innerHTML = '<div id="chat-empty">Nenhuma mensagem ainda.</div>';
    return;
  }

  container.innerHTML = '';
  data.forEach(msg => {
    const bubble = document.createElement('div');
    bubble.className = 'msg ' + (msg.direction === 'out' ? 'out' : 'in');
    const texto = msg.content || (msg.media_type ? '[' + msg.media_type + ']' : '');
    bubble.innerHTML = escapeHtml(texto) + '<div class="time">' + formatTime(msg.created_at) + '</div>';
    container.appendChild(bubble);
  });
  container.scrollTop = container.scrollHeight;
}

async function sendChatMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !currentLead) return;

  const sendBtn = document.getElementById('chat-send');
  sendBtn.disabled = true;

  try {
    const res = await fetch('/api/send-message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ leadId: currentLead.id, phone: currentLead.phone, message: text }),
    });
    const data = await res.json();
    if (!res.ok) {
      alert('Não consegui enviar: ' + (data.error || 'erro desconhecido'));
      return;
    }
    input.value = '';
    await loadMessages();
  } catch (err) {
    alert('Erro de conexão ao enviar: ' + err.message);
  } finally {
    sendBtn.disabled = false;
  }
}

document.getElementById('chat-close').addEventListener('click', closeChat);
document.getElementById('overlay').addEventListener('click', closeChat);
document.getElementById('chat-send').addEventListener('click', sendChatMessage);
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
});

// ============================================
// Arrastar e soltar (mover lead de coluna)
// ============================================
function onDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
async function onDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const leadId = e.dataTransfer.getData('text/plain');
  const newStageId = e.currentTarget.dataset.stageId;
  const lead = leads.find(l => l.id === leadId);
  if (!lead || lead.stage_id === newStageId) return;

  const { error } = await sb.from('leads').update({ stage_id: newStageId }).eq('id', leadId);
  if (error) {
    alert('Não consegui mover o lead: ' + error.message);
    return;
  }
  await loadBoard();
}

// ============================================
// Gerenciar colunas (criar / renomear / apagar)
// ============================================
async function createNewStage() {
  const name = prompt('Nome da nova coluna:');
  if (!name || !name.trim()) return;
  const boardId = stages[0] ? stages[0].board_id : null;
  const { error } = await sb.from('stages').insert({
    name: name.trim(),
    position: nextPosition(stages),
    board_id: boardId,
  });
  if (error) { alert('Erro ao criar coluna: ' + error.message); return; }
  await loadBoard();
}

async function openColumnMenu(stage) {
  const choice = prompt(
    'Coluna "' + stage.name + '":\n1 = Renomear\n2 = Apagar\n(qualquer outra tecla cancela)'
  );
  if (choice === '1') {
    const novoNome = prompt('Novo nome:', stage.name);
    if (!novoNome || !novoNome.trim()) return;
    const { error } = await sb.from('stages').update({ name: novoNome.trim() }).eq('id', stage.id);
    if (error) { alert('Erro ao renomear: ' + error.message); return; }
    await loadBoard();
  } else if (choice === '2') {
    const leadsNaColuna = leads.filter(l => l.stage_id === stage.id).length;
    if (leadsNaColuna > 0) {
      alert('Essa coluna tem ' + leadsNaColuna + ' lead(s). Mova todos pra outra coluna antes de apagar.');
      return;
    }
    if (!confirm('Apagar a coluna "' + stage.name + '"? Essa ação não pode ser desfeita.')) return;
    const { error } = await sb.from('stages').delete().eq('id', stage.id);
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    await loadBoard();
  }
}

init();
</script>
